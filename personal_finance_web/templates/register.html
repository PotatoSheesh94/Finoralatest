{% extends "base.html" %}
{% block title %}Register – {{ app_title }}{% endblock %}
{% block content %}
<div class="auth-wrap">
  <h1>Create Account</h1>
  <p class="subtitle">Start managing your finances</p>
  <form method="post">
    <div class="form-group">
      <label for="full_name">Full Name</label>
      <input class="form-control" type="text" id="full_name" name="full_name" required>
    </div>
    <div class="form-group">
      <label for="username">Username</label>
      <input class="form-control" type="text" id="username" name="username" required>
    </div>
    <div class="form-group">
      <label for="email">Email (optional)</label>
      <input class="form-control" type="email" id="email" name="email">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password" required minlength="4">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Register</button>
  </form>
  <p class="auth-links">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</div>
{% endblock %}
