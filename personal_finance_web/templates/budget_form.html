{% extends "base.html" %}
{% block title %}Add Budget – {{ app_title }}{% endblock %}
{% block content %}
<div class="page-header">
  <div><p class="eyebrow">Plan with intention</p><h1>Add budget</h1><p class="page-subtitle">Create a simple guardrail for what matters most.</p></div>
</div>
<div class="card form-card">
  <form method="post">
    <div class="form-group">
      <label for="category_id">Category (optional)</label>
      <select class="form-control" id="category_id" name="category_id">
        <option value="0">Overall (all expenses)</option>
        {% for c in categories %}
          <option value="{{ c.id }}">{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="amount">Amount (₱)</label>
      <input class="form-control" type="number" step="0.01" min="0.01" id="amount" name="amount" required>
    </div>
    <div class="form-group">
      <label for="period">Period</label>
      <select class="form-control" id="period" name="period">
        <option value="monthly">Monthly</option>
        <option value="weekly">Weekly</option>
        <option value="yearly">Yearly</option>
      </select>
    </div>
    <div class="form-group">
      <label for="start_date">Start Date</label>
      <input class="form-control" type="date" id="start_date" name="start_date" value="{{ today }}" required>
    </div>
    <div class="form-group">
      <label for="notes">Notes</label>
      <input class="form-control" type="text" id="notes" name="notes">
    </div>
    <div class="btn-group">
      <button type="submit" class="btn btn-primary">Save Budget</button>
      <a href="{{ url_for('budgets') }}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
